name: Update VTI quote

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-vti-quote
  cancel-in-progress: true

jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch VTI
        run: |
          node <<'NODE'
          const fs = require('fs');
          const url = 'https://query1.finance.yahoo.com/v8/finance/chart/VTI?interval=1d&range=1d';
          fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' } })
            .then(r => {
              if (!r.ok) throw new Error('Yahoo returned ' + r.status);
              return r.json();
            })
            .then(data => {
              const meta = data?.chart?.result?.[0]?.meta;
              if (!(meta?.regularMarketPrice > 0) || !meta.regularMarketTime) throw new Error('Invalid VTI quote');
              fs.writeFileSync('vti-quote.json', JSON.stringify({
                symbol: 'VTI',
                currency: meta.currency || 'USD',
                price: meta.regularMarketPrice,
                marketTime: meta.regularMarketTime,
                updatedAt: new Date().toISOString(),
                source: 'Yahoo Finance'
              }));
            });
          NODE
      - name: Publish quote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vti-quote.json
          git diff --cached --quiet || git commit -m "Update VTI quote"
          git push
